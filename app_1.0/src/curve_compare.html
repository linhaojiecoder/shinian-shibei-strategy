    axisLabel: { color: '#7d8896', fontSize: 11 },
  },
  yAxis: {
    type: 'value',
    scale: true,
    axisLabel: { color: '#7d8896', formatter: v => v.toFixed(0) + '万' },
    splitLine: { lineStyle: { color: 'rgba(31,41,55,0.5)' } },
  },
  series: series,
});

window.addEventListener('resize', () => chart.resize());
</script>
</body>
</html>
